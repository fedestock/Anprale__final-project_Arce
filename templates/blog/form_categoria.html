{% extends 'base.html' %}

{% block title %}Nueva categoría - Anprale{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header" style="background:#2c5f2d; color:white;">Nueva categoría</div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            {{ form.nombre }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            {{ form.descripcion }}
                        </div>
                        <button type="submit" class="btn btn-success">Guardar</button>
                        <a href="{% url 'home' %}" class="btn btn-secondary ms-2">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
