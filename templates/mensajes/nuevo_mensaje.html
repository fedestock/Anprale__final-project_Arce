{% extends 'base.html' %}

{% block title %}Nuevo mensaje - Anprale{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header" style="background:#2c5f2d; color:white;">
                    <h4 class="mb-0">Nuevo mensaje</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Para</label>
                            {{ form.destinatario }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Asunto</label>
                            {{ form.asunto }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mensaje</label>
                            {{ form.contenido }}
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Enviar</button>
                            <a href="{% url 'bandeja_entrada' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
